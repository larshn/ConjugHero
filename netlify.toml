[build]
  command = "npx expo export --platform web && cp -r public/* dist/ && mkdir -p dist/assets && cp assets/icon-*.png dist/assets/ && node -e \"const fs=require('fs');const f='dist/sw.js';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__BUILD_VERSION__',Date.now()))\""
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Cache control for PWA assets
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# SPA routing - redirect all requests to index.html (except for static files)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
