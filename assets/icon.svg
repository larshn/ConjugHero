<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#002395"/>
      <stop offset="50%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#ED2939"/>
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bgGradient)"/>

  <!-- French flag stripe at bottom -->
  <rect x="100" y="850" width="824" height="60" rx="30" fill="url(#accentGradient)" opacity="0.9"/>

  <!-- Main text "CH" -->
  <text x="512" y="520"
        font-family="Arial, Helvetica, sans-serif"
        font-size="420"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">CH</text>

  <!-- Accent circle (like a speech bubble dot) -->
  <circle cx="820" y="280" r="60" fill="#FBBF24" opacity="0.9"/>

  <!-- Small verb conjugation hint -->
  <text x="512" y="680"
        font-family="Arial, Helvetica, sans-serif"
        font-size="80"
        font-weight="500"
        fill="white"
        text-anchor="middle"
        opacity="0.8">je parle</text>
</svg>
